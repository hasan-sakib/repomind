services:
  postgres:
    # pgvector/pgvector:pg16 = postgres:16 + the pgvector extension
    # pre-installed, needed for code_embeddings.embedding (Phase 4).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: repomind
      POSTGRES_PASSWORD: repomind
      POSTGRES_DB: repomind
    ports:
      - "5432:5432"
    volumes:
      - repomind_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repomind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # `api` and `worker` share one image (backend/Dockerfile) — same shape as
  # the two Fly.io process groups described in docs/deployment/deployment.md,
  # just running as two compose services instead. Secrets (JWT_SECRET,
  # GITHUB_*, ANTHROPIC_API_KEY, VOYAGE_API_KEY, ...) come from backend/.env,
  # which you already need for native local dev — see backend/.env.example.
  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Overrides backend/.env's localhost values — inside the compose
      # network, Postgres/Redis are reachable by service name, not
      # localhost. If AI_PROVIDER=ollama, OLLAMA_HOST must similarly point
      # somewhere reachable from inside the container, e.g.
      # http://host.docker.internal:11434 for Ollama running on the host.
      DATABASE_URL: postgresql+asyncpg://repomind:repomind@postgres:5432/repomind
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
      # backend/.env's OLLAMA_HOST=http://localhost:11434 means "this
      # container itself" from in here, not the Mac host running `ollama
      # serve` — host.docker.internal is Docker Desktop's DNS name for the
      # host machine.
      OLLAMA_HOST: http://host.docker.internal:11434
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://repomind:repomind@postgres:5432/repomind
      REDIS_URL: redis://redis:6379
      OLLAMA_HOST: http://host.docker.internal:11434
    command: arq app.workers.settings.WorkerSettings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the client bundle at build time (Next.js NEXT_PUBLIC_*
        # rule) — this is what the *browser* calls, so it must stay
        # host-reachable (localhost:8000, from the browser's point of
        # view), never the compose-network service name.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      # Set at *runtime* (not a build arg — this one isn't NEXT_PUBLIC_,
      # so it's never in the client bundle and can change without a
      # rebuild). Used only by Server Components/route handlers running
      # inside this container (lib/server-api.ts) — from there, "api" is
      # this compose network's service name, not "localhost", which would
      # otherwise resolve to the web container itself and fail with
      # ECONNREFUSED (the exact bug this fixed).
      API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  repomind_postgres_data:
