[project]
name = "repomind-api"
version = "0.1.0"
description = "RepoMind API — AI codebase intelligence backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.1",
    "psycopg[binary]>=3.2.3",
    "anthropic>=0.39.0",
    "httpx>=0.27.2",
    "pyjwt[crypto]>=2.9.0",
    "python-multipart>=0.0.12",
    "argon2-cffi>=23.1.0",
    "pydantic[email]>=2.9.0",
    "arq>=0.26.3",
    "pathspec>=0.12.1",
    "tree-sitter>=0.23.2",
    "tree-sitter-python>=0.23.6",
    "tree-sitter-javascript>=0.23.1",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-go>=0.23.4",
    "voyageai>=0.3.2",
    "pgvector>=0.3.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.11.2",
    "pytest-httpx>=0.35.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerate produces long lines it doesn't format for us — never
# hand-edit these for style, only for correctness.
"app/db/migrations/versions/*.py" = ["E501"]
# Settings must be populated (env vars, a generated test RSA key) before
# importing app modules that read them at import time via get_settings().
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# One event loop for the whole session, matching production (one loop for
# the process lifetime). Without this, pytest-asyncio's default per-test
# loop breaks any code — like app.db.session's module-level engine, used
# by background sync tasks — that isn't re-created per test via a fixture.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
